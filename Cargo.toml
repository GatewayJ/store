[workspace]
resolver = "2"
members = [
	"meta_node",
	"data_node",
	"common_proto",
	"log_client",
]

[workspace.dependencies]
tokio = { version = "1.39", features = ["full"] }
tokio-stream = "0.1.15"
tonic = "0.12"
tonic-build = "0.12"
tower = { version = "0.4.7", features = ["timeout"] }
prost = "0.13"
prost-types = "0.13"
serde = { version = "1.0.114", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.0", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "1.0"
uuid = { version = "1.10", features = ["v4"] }
rand = "0.8.5"
bytes = "1.7.1"
arc-swap = "1.7"
clap = { version = "4.1.11", features = ["derive", "env"] }
nix = "0.29"
quick_cache = "0.6.6"
